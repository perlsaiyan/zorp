# ~/.config/zorp/config.toml
[auth]
# Application (client) ID of your zorp app registration (README: App registration).
client_id = "00000000-0000-0000-0000-000000000000"
# "organizations" accepts any work/school account.
tenant = "organizations"

# Guardrails are off by default. To try things out safely, uncomment:
# [safety]
# safe_mode = true    # only send to yourself; no deleting; moves only to scratch_folder

[calendar]
after_respond = "archive"   # what happens to an invite once answered: archive, delete or keep

[notify]
click_command = "zorp-focus"

[ui]
color = "auto"
graphics = "auto"
